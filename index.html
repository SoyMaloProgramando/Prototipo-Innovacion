<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TarifaJusta: calcula cuánto cobrar por tu trabajo de Ingeniería de Sistemas o Ingeniería en Multimedia." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140d1a" media="(prefers-color-scheme: dark)" />
    <script>
      // Aplica el modo claro u oscuro guardado antes de pintar, para que no parpadee.
      try {
        var tema = localStorage.getItem('tarifajusta-tema');
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>TarifaJusta</title>
  </head>
  <body>
    <div id="raiz"></div>
    <noscript>TarifaJusta necesita JavaScript para calcular las cotizaciones.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
